  <line x1="463.58500000000004" x2="463.58500000000004" y1="282" y2="18" stroke="#e8a13c" stroke-dasharray="4 4" opacity="0.75"/>
  <text x="471.58500000000004" y="28" fill="#e8a13c" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="10.5" letter-spacing="0.06em">the cliff · ~32 mph</text>
  <line x1="235.15" x2="235.15" y1="48.867692307692295" y2="119.53846153846152" stroke="#9da2a6" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
