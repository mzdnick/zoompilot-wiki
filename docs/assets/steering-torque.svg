<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Available steering torque from the EPS across speed, up to about 45 mph. The EPS can apply up to 1148 counts at neighborhood speeds, ramping down through nine measured points to 620 by the cliff near 32 mph. zoompilot tracks that measured ceiling; stock openpilot caps every command at one flat 800-count scale, leaving about a third of the available torque unused below the cliff.">
  <title>EPS torque you can get, by speed: the measured ceiling vs stock's flat 800 cap</title>
