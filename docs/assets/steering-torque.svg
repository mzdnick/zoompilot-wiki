  <line class="tc-grid" x1="46" x2="628" y1="119.53846153846152" y2="119.53846153846152" stroke="rgba(255,255,255,0.06)"/><text x="38" y="123.53846153846152" text-anchor="end" fill="#7e8695" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="11">800</text>
