  <line x1="337" x2="337" y1="282" y2="286" stroke="rgba(255,255,255,0.16)"/><text x="337" y="300" text-anchor="middle" fill="#7e8695" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="11">22</text>
