  <text x="54" y="40.867692307692295" text-anchor="start" fill="#9da2a6" font-family='"JetBrains Mono", ui-monospace, Menlo, monospace' font-size="10.5" letter-spacing="0.04em">zoompilot · the full measured ceiling</text>
