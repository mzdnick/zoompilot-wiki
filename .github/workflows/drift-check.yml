# Drift check: is the wiki behind the site and the zoompilot repo?
#
# Daily (plus manual runs from the Actions tab). Two signals:
#   1. the current release on zoompilot.ai vs the newest version in
#      docs/releases/changelog.md
#   2. commits touching docs/zoompilot on the zoompilot repo that
#      are newer than this repo's last docs/technical/ commit,
#      which docs/technical/ mirrors by hand
#
# Any finding opens or updates one issue, "Wiki drift: ...", with a
# short runbook. A clear run closes it.
#
# Needs no secrets: GITHUB_TOKEN is the automatic workflow token.
name: drift check

on:
  schedule:
    - cron: "17 7 * * *" # daily 07:17 UTC
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/drift-check.mjs
