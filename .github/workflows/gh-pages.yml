# Optional alternative to Cloudflare Pages. cloudflare-pages.yml is
# the primary target, so this one is dispatch-only (run it from the
# Actions tab).
#
# To publish on GitHub Pages instead:
#   1. Repository settings → Pages → Source → GitHub Actions
#   2. Run this workflow manually.
# Keep only one deployment target active at a time.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Zensical writes to site/ (the mkdocs.yml default); it has no
      # --site-dir flag.
      - run: zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
